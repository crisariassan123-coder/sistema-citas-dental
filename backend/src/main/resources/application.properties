spring.application.name=citasdental

# Lee las variables del archivo .env de la raiz del proyecto
spring.config.import=optional:file:../.env[.properties]

# Conexion a PostgreSQL (puerto 5433 de Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA: las tablas las crea Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false