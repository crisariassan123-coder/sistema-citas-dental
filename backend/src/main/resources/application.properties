spring.application.name=citasdental

# Se leen las variables del archivo .env de la raiz del proyecto
spring.config.import=optional:file:../.env[.properties]

# Se configura la conexion a PostgreSQL (puerto 5433 de Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA: las tablas se crean con Flyway; Hibernate solo las valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Se configura la firma de los tokens JWT (el secreto se lee del archivo .env)
app.jwt.secreto=${JWT_SECRET}
app.jwt.minutos-expiracion=60

# Se define el administrador inicial (solo se crea si no existe ningun usuario)
app.admin.nombre=${ADMIN_NOMBRE:Administrador}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
